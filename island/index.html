<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悬浮海岛 · 灯塔微缩水景</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfeefb;
    font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; }
  canvas { display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(30,60,90,.18) 100%); }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #14506e; }
  .card { pointer-events: auto; background: rgba(255,255,255,.62); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.75); border-radius: 14px;
    box-shadow: 0 6px 24px rgba(20,80,120,.14); }
  #title-card { position: absolute; top: 18px; left: 18px; padding: 12px 18px; }
  #title-card h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  #title-card p { margin: 3px 0 0; font-size: 12px; opacity: .72; }
  #dock { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; pointer-events: auto; }
  #dock button { border: 0; border-radius: 10px; padding: 8px 14px; font-size: 13px;
    cursor: pointer; background: #147bb3; color: #fff; transition: .15s; font-family: inherit; }
  #dock button:hover { filter: brightness(1.08); }
  #dock button.on { background: #17954d; }
  #modes { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px 8px; pointer-events: auto; }
  #modes button { border: 0; border-radius: 8px; padding: 6px 12px; font-size: 12px;
    cursor: pointer; background: rgba(255,255,255,.55); color: #14506e; transition: .15s;
    font-family: inherit; }
  #modes button.on { background: #147bb3; color: #fff; }
  #hint { font-size: 12px; opacity: .65; margin: 0 4px; }
  #voyage-card { position: absolute; right: 18px; top: 18px; width: 240px; padding: 12px 14px; }
  #voyage-card.hidden { display: none; }
  #voyage-card h3 { margin: 0 0 6px; font-size: 14px; color: #14506e; }
  #voyage-status { min-height: 34px; font-size: 12px; line-height: 1.45; opacity: .78; }
  #voyage-track { height: 7px; border-radius: 99px; background: rgba(20,80,120,.16); overflow: hidden; margin: 8px 0 8px; }
  #voyage-fill { display: block; width: 0%; height: 100%; border-radius: 99px; background: #14a06a; transition: width .12s linear; }
  #catch-list { list-style: none; margin: 0 0 8px; padding: 0; font-size: 12px; min-height: 20px; }
  #catch-list li { padding: 2px 0; border-top: 1px solid rgba(20,80,120,.08); opacity: .78; }
  #btn-return { width: 100%; border: 0; border-radius: 9px; padding: 7px 10px; font-size: 12px;
    cursor: pointer; background: rgba(20,123,179,.12); color: #14506e; font-family: inherit; transition: .15s; }
  #btn-return:hover { background: rgba(20,123,179,.2); }
  #btn-return:disabled { opacity: .35; cursor: not-allowed; }
  @media (max-width: 700px) { #voyage-card { width: calc(100vw - 36px); top: auto; bottom: 108px; } }
  #sleep-overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 48%, rgba(6,14,30,.42), rgba(3,8,18,.82));
    opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #sleep-overlay.active { opacity: 1; pointer-events: auto; }
  .sleep-card { padding: 20px 30px; border-radius: 18px; background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.20); color: #f7fbff; text-align: center;
    backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .sleep-card .emoji { font-size: 34px; }
  .sleep-card h2 { margin: 8px 0 4px; font-size: 20px; letter-spacing: 1px; }
  .sleep-card p { margin: 0; font-size: 13px; opacity: .78; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #dfeefb; color: #3a7ea8; font-size: 15px; letter-spacing: 2px;
    transition: opacity .5s; z-index: 10; }
  @media (max-width: 560px) { #hint { display: none; } #title-card h1 { font-size: 16px; } }
</style>
</head>
<body>
<div id="sleep-overlay">
  <div class="sleep-card"><div class="emoji">💤</div><h2>睡觉中</h2><p id="sleep-text">时间正在流逝…</p></div>
</div>
<div id="loading">正在生成海岛 …</div>
<div id="vignette"></div>
<div id="hud">
  <div id="title-card" class="card">
    <h1>🏝️ 悬浮海岛 · 灯塔水景</h1>
    <p>悬浮岛 · 鲸鱼 · 灯塔 · 全部程序化生成</p>
  </div>
  <div id="dock" class="card">
    <button id="btn-rotate" class="on">自动旋转：开</button>
    <button id="btn-feed">🍞 投喂鱼群</button>
    <span id="hint">拖拽旋转 · 滚轮缩放 · 点击水面投喂</span>
  </div>
  <div id="voyage-card" class="card hidden">
    <h3>🎣 海上航行 · 钓鱼</h3>
    <div id="voyage-status">点击木船即可上船。</div>
    <div id="voyage-track"><i id="voyage-fill"></i></div>
    <ul id="catch-list"></ul>
    <button id="btn-return">⚓ 返航下船</button>
  </div>
  <div id="modes" class="card">
    <button data-m="day" class="on">☀️ 白天</button>
    <button data-m="sunset">🌇 日落</button>
    <button data-m="moon">🌙 月升</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础常量 ================= */
const TANK = 26.5, TANK_H = 8.8, HALF = TANK / 2, GT = 0.35;
const AMP = 0.16;
const ISLAND_C = new THREE.Vector2(0.6, 0.35);
const PIER_A = 0.45;

let seed = 424242;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rand();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe8f4fb, 60, 170);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
camera.position.set(19, 4.2, 23);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, -1.4, 0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8; controls.maxDistance = 52;
controls.maxPolarAngle = 1.52;
controls.enablePan = false;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 0.6;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

/* ================= 天空 / 灯光 / 地面 ================= */
const sunDir = new THREE.Vector3(0.47, 0.83, 0.36).normalize();
const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, fog: false, depthWrite: false,
    uniforms: { uSun: { value: sunDir }, uTop: { value: new THREE.Color(0x5ab5ee) }, uBot: { value: new THREE.Color(0xeaf6fd) }, uGlow: { value: new THREE.Color(0xfff0c8) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `varying vec3 vP; uniform vec3 uSun; uniform vec3 uTop; uniform vec3 uBot; uniform vec3 uGlow;
      void main(){
        vec3 d = normalize(vP);
        vec3 col = mix(uBot, uTop, smoothstep(-0.06, 0.62, d.y));
        float s = max(dot(d, uSun), 0.0);
        col += (pow(s, 380.0)*0.85 + pow(s, 10.0)*0.10) * uGlow;
        gl_FragColor = vec4(col, 1.0);
      }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(160, 32, 16), skyMat);
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xcdeaff, 0x9a8a66, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 3.0);
sun.position.set(18, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
sun.shadow.camera.near = 6; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe8ff, 0.5);
fill.position.set(-12, 8, -14);
scene.add(fill);

/* ================= 光照模式（白天 / 日落 / 月升） ================= */
const modeTargets = {
  day: {
    top: new THREE.Color(0x5ab5ee), bot: new THREE.Color(0xeaf6fd), glow: new THREE.Color(0xfff0c8),
    sunDir: new THREE.Vector3(0.47, 0.83, 0.36).normalize(),
    sunColor: new THREE.Color(0xfff1d6), sunI: 2.4,
    fillColor: new THREE.Color(0xcfe8ff), fillI: 0.5, hemiI: 0.32,
    fog: new THREE.Color(0xe8f4fb), exposure: 1.0, lampI: 4, beamO: 0.06, fireI: 0, waterEnv: 0.3, envInt: 0.5, jelly: 0.25
  },
  sunset: {
    top: new THREE.Color(0x8e3f78), bot: new THREE.Color(0xffc08a), glow: new THREE.Color(0xff8a3c),
    sunDir: new THREE.Vector3(1.0, 0.16, 0.35).normalize(),
    sunColor: new THREE.Color(0xffa050), sunI: 2.0,
    fillColor: new THREE.Color(0xff9a7a), fillI: 0.75, hemiI: 0.34,
    fog: new THREE.Color(0xecc4d4), exposure: 1.0, lampI: 8, beamO: 0.15, fireI: 3.2, waterEnv: 0.35, envInt: 0.5, jelly: 0.65
  },
  dawn: {
    top: new THREE.Color(0x4f8fd0), bot: new THREE.Color(0xffd9b0), glow: new THREE.Color(0xffd9a0),
    sunDir: new THREE.Vector3(0.75, 0.28, 0.18).normalize(),
    sunColor: new THREE.Color(0xffd0a0), sunI: 1.6,
    fillColor: new THREE.Color(0xffc9a0), fillI: 0.55, hemiI: 0.25,
    fog: new THREE.Color(0xdceaf4), exposure: 0.96, lampI: 7, beamO: 0.12, fireI: 1.0, waterEnv: 0.22, envInt: 0.32, jelly: 0.45
  },
  moon: {
    top: new THREE.Color(0x0a1230), bot: new THREE.Color(0x27406b), glow: new THREE.Color(0xbfd4ff),
    sunDir: new THREE.Vector3(-0.45, 0.72, -0.35).normalize(),
    sunColor: new THREE.Color(0x9fb8e8), sunI: 0.9,
    fillColor: new THREE.Color(0x24406e), fillI: 0.4, hemiI: 0.12,
    fog: new THREE.Color(0x0c1730), exposure: 0.88, lampI: 13, beamO: 0.3, fireI: 4.5, waterEnv: 0.05, envInt: 0.18, jelly: 1.0
  }
};
const env = {
  top: modeTargets.day.top.clone(), bot: modeTargets.day.bot.clone(),
  glow: modeTargets.day.glow.clone(), sunDir: modeTargets.day.sunDir.clone(),
  sunColor: modeTargets.day.sunColor.clone(), sunI: 3.0,
  fillColor: modeTargets.day.fillColor.clone(), fillI: 0.5, hemiI: 0.55,
  fog: modeTargets.day.fog.clone(), exposure: 1.0, lampI: 4, beamO: 0.06, fireI: 0, waterEnv: 0.3, envInt: 0.5, jelly: 0.25
};
let envTarget = modeTargets.day;
let envMode = 'day';
function stepEnv(dt) {
  const k = 1 - Math.exp(-dt * 2.2), t = envTarget;
  env.top.lerp(t.top, k); env.bot.lerp(t.bot, k); env.glow.lerp(t.glow, k);
  env.sunDir.lerp(t.sunDir, k).normalize();
  env.sunColor.lerp(t.sunColor, k); env.fog.lerp(t.fog, k); env.fillColor.lerp(t.fillColor, k);
  for (const p of ['sunI', 'fillI', 'hemiI', 'exposure', 'lampI', 'beamO', 'fireI', 'waterEnv', 'envInt', 'jelly']) env[p] += (t[p] - env[p]) * k;
  skyMat.uniforms.uTop.value.copy(env.top);
  skyMat.uniforms.uBot.value.copy(env.bot);
  skyMat.uniforms.uGlow.value.copy(env.glow);
  skyMat.uniforms.uSun.value.copy(env.sunDir);
  sun.color.copy(env.sunColor); sun.intensity = env.sunI;
  sun.position.copy(env.sunDir).multiplyScalar(30);
  fill.color.copy(env.fillColor); fill.intensity = env.fillI;
  hemi.intensity = env.hemiI;
  scene.fog.color.copy(env.fog);
  renderer.toneMappingExposure = env.exposure;
  scene.environmentIntensity = env.envInt;
  waterMat.envMapIntensity = env.waterEnv;
}
function setMode(name) {
  if (!modeTargets[name]) return;
  envMode = name;
  envTarget = modeTargets[name];
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === name));
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(220, 48),
  new THREE.MeshStandardMaterial({ color: 0xf3f7fa, roughness: 1 })
);
ground.geometry.rotateX(-Math.PI / 2);
ground.position.y = -9.4;
ground.receiveShadow = true;
scene.add(ground);

/* ================= 贴图工具 ================= */
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const woodTex = canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#b5854f'; x.fillRect(0, 0, w, h);
  for (let p = 0; p < 4; p++) {
    const y = p * 32;
    x.fillStyle = p % 2 ? '#ad7c46' : '#bd8b55'; x.fillRect(0, y, w, 31);
    x.fillStyle = '#7a5530'; x.fillRect(0, y + 30, w, 2);
    x.strokeStyle = 'rgba(90,60,30,.35)'; x.lineWidth = 1;
    for (let g = 0; g < 5; g++) {
      x.beginPath(); const gy = y + 4 + Math.random() * 24;
      x.moveTo(0, gy); x.bezierCurveTo(w * .3, gy + 3, w * .6, gy - 3, w, gy); x.stroke();
    }
  }
}, true);

const stripeTex = canvasTex(96, 192, (x, w, h) => {
  x.fillStyle = '#f4f1ea'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#e03d2d';
  for (let i = 0; i < 4; i++) x.fillRect(0, 12 + i * 48, w, 24);
}, true);
stripeTex.repeat.set(2, 2);

const trunkTex = canvasTex(64, 128, (x, w, h) => {
  x.fillStyle = '#8a5a3a'; x.fillRect(0, 0, w, h);
  for (let y = 4; y < h; y += 13) {
    x.fillStyle = '#6e4429';
    x.beginPath(); x.moveTo(0, y);
    for (let px = 0; px <= w; px += 8) x.lineTo(px, y + Math.sin(px * .3) * 2);
    x.lineTo(w, y + 5); x.lineTo(0, y + 5); x.fill();
  }
}, true);
trunkTex.repeat.set(1, 3);

const frondTex = canvasTex(256, 128, (x, w, h) => {
  x.clearRect(0, 0, w, h);
  x.strokeStyle = '#3e7a34'; x.lineWidth = 5;
  x.beginPath(); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.stroke();
  for (let i = 0; i < 30; i++) {
    const t = i / 29, px = 6 + (w - 12) * t, py = h / 2;
    const L = (1 - t * 0.8) * h * 0.46, a = 0.5 + 0.45 * t;
    x.strokeStyle = t % 2 ? '#3f8f3a' : '#57a848';
    x.lineWidth = 2.4 - t * 1.2;
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * L * (w / h) * 0.6, py + Math.sin(a) * L); x.stroke();
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * L * (w / h) * 0.6, py - Math.sin(a) * L); x.stroke();
  }
});

const causticsTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(255,255,255,.85)'; x.shadowColor = '#fff'; x.shadowBlur = 5;
  for (let i = 0; i < 85; i++) {
    x.lineWidth = 1.2 + Math.random() * 1.8;
    const a0 = Math.random() * Math.PI * 2;
    x.beginPath();
    x.arc(Math.random() * w, Math.random() * h, 7 + Math.random() * 26, a0, a0 + 1 + Math.random() * 1.4);
    x.stroke();
  }
}, true);
causticsTex.repeat.set(4, 4);

const sandTex = canvasTex(128, 128, (x, w, h) => {
  x.fillStyle = '#e8d5a0'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) {
    x.fillStyle = ['#d4bd85', '#f2e4b8', '#cbb27a'][i % 3];
    x.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
  }
}, true);
sandTex.repeat.set(5, 5);

const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85 }, o));

/* ================= 玻璃水箱（只到水面为止，顶部干净） ================= */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x9fd8c8, roughness: 0.05, metalness: 0,
  transmission: 1, thickness: 0.5, ior: 1.45, envMapIntensity: 0.5
});
{
  const wallGeo = new THREE.BoxGeometry(TANK + GT * 2, TANK_H, GT);
  for (const [px, pz, ry] of [[0, HALF + GT / 2, 0], [0, -(HALF + GT / 2), 0],
      [HALF + GT / 2, 0, Math.PI / 2], [-(HALF + GT / 2), 0, Math.PI / 2]]) {
    const wall = new THREE.Mesh(wallGeo, glassMat);
    wall.position.set(px, -TANK_H / 2, pz);
    wall.rotation.y = ry;
    scene.add(wall);
  }
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(TANK + GT * 2, GT, TANK + GT * 2), glassMat);
  bottom.position.y = -TANK_H - GT / 2;
  scene.add(bottom);

  const rimMat = std(0xf4fafc, { roughness: 0.4 });
  const rimGeoA = new THREE.BoxGeometry(TANK + GT * 2 + 0.2, 0.22, 0.32);
  const rimGeoB = new THREE.BoxGeometry(0.32, 0.22, TANK + GT * 2 + 0.2);
  for (const s of [1, -1]) {
    const ra = new THREE.Mesh(rimGeoA, rimMat); ra.position.set(0, 0.02, s * (HALF + GT / 2)); scene.add(ra);
    const rb = new THREE.Mesh(rimGeoB, rimMat); rb.position.set(s * (HALF + GT / 2), 0.02, 0); scene.add(rb);
  }
}

/* ================= 水面（干净海面 · 动态波浪） ================= */
function waveH(x, z, t) {
  return (Math.sin(x * 0.50 + t * 1.35) * 0.50 + Math.sin(z * 0.62 - t * 1.05) * 0.40 +
          Math.sin((x + z) * 0.33 + t * 0.80) * 0.30 + Math.sin((x - z) * 0.21 - t * 0.60) * 0.20) * AMP;
}
const waterU = { uTime: { value: 0 } };
const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x2aa393, transparent: true, opacity: 0.88,
  roughness: 0.14, metalness: 0.05, clearcoat: 0.4, clearcoatRoughness: 0.2,
  envMapIntensity: 0.3, side: THREE.DoubleSide
});
waterMat.onBeforeCompile = (sh) => {
  sh.uniforms.uTime = waterU.uTime;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uTime;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      float mE = max(abs(position.x), abs(position.z));
      float ef = 1.0 - smoothstep(9.2, 11.6, mE);
      float wv = sin(position.x * 0.50 + uTime * 1.35) * 0.50
               + sin(position.z * 0.62 - uTime * 1.05) * 0.40
               + sin((position.x + position.z) * 0.33 + uTime * 0.80) * 0.30
               + sin((position.x - position.z) * 0.21 - uTime * 0.60) * 0.20;
      transformed.y += wv * 0.16 * ef;`);
};
const waterGeo = new THREE.PlaneGeometry(TANK - 0.06, TANK - 0.06, 110, 110);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat);
water.receiveShadow = true;
scene.add(water);

/* 水下淡蓝水体（消除“中空”感） */
const volumeMat = new THREE.MeshBasicMaterial({ color: 0x2fbf9e, transparent: true, opacity: 0.3, side: THREE.BackSide, depthWrite: false });
const volume = new THREE.Mesh(new THREE.BoxGeometry(TANK - 0.12, TANK_H - 0.06, TANK - 0.12), volumeMat);
volume.position.y = -TANK_H / 2;
scene.add(volume);

/* ================= 海底沙地 + 珊瑚礁 ================= */
const sandMat = new THREE.MeshStandardMaterial({
  map: sandTex, roughness: 1,
  emissive: 0x9fdcec, emissiveMap: causticsTex, emissiveIntensity: 0.5
});
{
  const g = new THREE.PlaneGeometry(TANK - 0.4, TANK - 0.4, 48, 48);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {

function jitterGeo(geo, amt) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.abs(Math.sin(i * 12.9898) * 43758.5453 % 1);
    p.setX(i, v.x + (n - 0.5) * amt);
    p.setZ(i, v.z + (Math.abs(Math.sin(i * 78.233) * 12345.6789 % 1) - 0.5) * amt);
  }
  geo.computeVertexNormals();
  return geo;
}

    const geo = new THREE.CylinderGeometry(rad * 0.78, rad, len, 6);

    geos.push(geo);

      tip.applyMatrix4(mat.clone().multiply(new THREE.Matrix4().makeTranslation(0, len, 0)));

// 上表面高度表直接取自同一条 B 曲线，保证主角、建筑与沙滩贴合。
const beachTopSurface = (() => {
  let maxI = 0;
  PROFILE.forEach((p, i) => { if (p.x > PROFILE[maxI].x) maxI = i; });
  return PROFILE.slice(maxI).reverse().filter(p => p.x <= 6.68 && p.x >= 0);
})();

const baseGrassEdge = (() => {
  const p = beachTopSurface.find(q => q.y <= .77);
  return p ? p.x : 5.55;
})();
function grassBoundaryAt(angle) {
  const wave = Math.sin(angle * 3 + 1.7) * .27
    + Math.sin(angle * 7 + .8) * .18
    + Math.sin(angle * 11 + 2.4) * .12
    + Math.sin(angle * 17 + 4.1) * .07;
  return baseGrassEdge + Math.max(0, wave) * .45;
}
function grassEdgeWidthAt(angle) {
  return .20 + Math.sin(angle * 5 + 3.1) * .07 + Math.sin(angle * 9 + 1.1) * .04;
}
function isGrassSpot(angle, radius) {
  return radius <= grassBoundaryAt(angle) - grassEdgeWidthAt(angle) - .05;
}
function beachColorAt(y, n, angle, radius) {
  const grass = new THREE.Color(0x3f9440), grass2 = new THREE.Color(0x71c04e);
  const sand = new THREE.Color(0xe8d29c), wet = new THREE.Color(0xc9a86e);
  const rock = new THREE.Color(0x8a7a63), rock2 = new THREE.Color(0x6f6353), c = new THREE.Color();
  const smooth = (a, b, x) => THREE.MathUtils.smoothstep(x, a, b);
  c.copy(rock).lerp(rock2, smooth(-5.2, -.8, y));
  c.lerp(wet, smooth(-.8, -.15, y));
  c.lerp(sand, smooth(-.15, .22, y));

  // 草地/沙滩交界按方向不规则弯曲，但最靠近岛心的边界不会超过上一版位置，因此沙滩最大宽度不变。
  const a = angle ?? 0, r = radius ?? 0;
  const wave = Math.sin(a * 3 + 1.7) * .27
    + Math.sin(a * 7 + .8) * .18
    + Math.sin(a * 11 + 2.4) * .12
    + Math.sin(a * 17 + 4.1) * .07;
  const grassEdge = grassBoundaryAt(a);
  const edgeWidth = grassEdgeWidthAt(a);
  const insideGrass = 1 - smooth(grassEdge - edgeWidth, grassEdge + edgeWidth, r);
  const aboveWet = smooth(.08, .38, y);
  const grassMix = insideGrass * aboveWet;
  const grassBlend = grass.clone().lerp(grass2, n);
  c.lerp(grassBlend, grassMix);
  c.offsetHSL(0, 0, (n - .5) * .035);
  return c;
}
function topY(r) {
  if (r <= 0) return beachTopSurface[0].y - .055;
  if (r >= beachTopSurface[beachTopSurface.length - 1].x) return -.14;
  for (let i = 0; i < beachTopSurface.length - 1; i++) {
    const a = beachTopSurface[i], b = beachTopSurface[i + 1];
    if (r >= a.x && r <= b.x) {
      const t = (r - a.x) / Math.max(.000001, b.x - a.x);
      return a.y + (b.y - a.y) * t - .055;
    }
  }
  return beachTopSurface[beachTopSurface.length - 1].y - .055;
}

// 取渲染后的真实地表高度。
// 地形顶点先生成“轮廓半径”，再按角度做径向起伏；
// 因此从坐标反查高度时必须先把渲染半径反推回轮廓半径。
function terrainSurfaceAt(x, z) {
  const a = Math.atan2(z, x);
  const renderedRadius = Math.hypot(x, z);
  const radialBump = Math.sin(a * 4 + 1.3) * .06
    + Math.sin(a * 7 + 4.2) * .045
    + Math.sin(a * 11 + .7) * .03;
  const shapeRadius = renderedRadius / (1 + radialBump);
  return topY(shapeRadius) + .055 + Math.sin(a * 9 + 2.0) * .04;
}

// 小岛上的简易避障：灯塔、木屋、篝火与椰树干都作为圆形障碍。
const islandObstacles = (() => {
  const fireDir = new THREE.Vector2(Math.cos(PIER_A), Math.sin(PIER_A));
  const firePerp = new THREE.Vector2(-fireDir.y, fireDir.x);

  ];
  for (const palm of palms) list.push({ x: palm.position.x, z: palm.position.z, r: .32, palm: true });
  return list;
})();

function distancePointSegment(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const len2 = vx * vx + vz * vz;
  const t = len2 < 1e-8 ? 0 : Math.max(0, Math.min(1, ((px - ax) * vx + (pz - az) * vz) / len2));
  const cx = ax + vx * t, cz = az + vz * t;
  return { d: Math.hypot(px - cx, pz - cz), t, cx, cz };
}
function segmentClear(ax, az, bx, bz) {
  for (const o of islandObstacles) {
    const q = distancePointSegment(o.x, o.z, ax, az, bx, bz);
    if (q.d < o.r) return false;
  }
  return true;
}
function obstaclePathPoints() {
  const pts = [];
  for (const o of islandObstacles) {
    const count = o.palm ? 8 : 16;
    const rr2 = o.r + (o.palm ? .20 : .38);
    for (let i = 0; i < count; i++) {
      const a = i / count * Math.PI * 2;
      const x = o.x + Math.cos(a) * rr2;
      const z = o.z + Math.sin(a) * rr2;
      // 不把绕行点放进其它障碍物里。
      if (islandObstacles.every(q => Math.hypot(x - q.x, z - q.z) >= q.r + .04)) pts.push(new THREE.Vector2(x, z));
    }
  }
  return pts;
}
function planIslandPath(start, goal) {
  const a = new THREE.Vector2(start.x, start.z);
  const b = new THREE.Vector2(goal.x, goal.z);
  if (a.distanceTo(b) < .16) return [b.clone()];
  if (segmentClear(a.x, a.y, b.x, b.y)) return [b.clone()];

  const nodes = [a.clone(), b.clone()];
  for (const q of obstaclePathPoints()) nodes.push(q);

  const n = nodes.length;
  const dist = new Array(n).fill(Infinity);
  const prev = new Array(n).fill(-1);
  const done = new Array(n).fill(false);
  dist[0] = 0;

  for (let step = 0; step < n; step++) {
    let best = -1, bestScore = Infinity;
    for (let i = 0; i < n; i++) {
      if (!done[i] && dist[i] < bestScore) { best = i; bestScore = dist[i]; }
    }
    if (best < 0 || best === 1) break;
    done[best] = true;
    for (let i = 0; i < n; i++) {
      if (i === best || done[i]) continue;
      if (!segmentClear(nodes[best].x, nodes[best].y, nodes[i].x, nodes[i].y)) continue;
      const nd = dist[best] + nodes[best].distanceTo(nodes[i]);
      if (nd < dist[i]) { dist[i] = nd; prev[i] = best; }
    }
  }

  const path = [];
  for (let i = 1; i >= 0; i = prev[i]) {
    if (i < 0) break;
    path.unshift(nodes[i].clone());
  }
  // 简易图一定能绕过这组小障碍；若极端找不到路径，退回外圈绕行。
  if (path.length < 2) {
    const side = Math.sign((b.x - a.x) * (0 - a.y) - (b.y - a.y) * (0 - a.x)) || 1;
    path.length = 0;
    path.push(a.clone(), new THREE.Vector2(0 + side * 2.35, 0), b.clone());
  }
  // 第一个点就是起点，实际行走从下一个点开始。
  if (path.length > 1) path.shift();
  return path;
}

}

    return .40 * (1 - Math.pow(Math.abs(n), 1.55));
  };

  function gridGeometry(xCount, yCount, positionAt, uvScale = [4, 1]) {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= xCount; i++) {
      for (let j = 0; j <= yCount; j++) {
        const pt = positionAt(i / xCount, j / yCount);
        pos.push(pt.x, pt.y, pt.z);
        uv.push(i / xCount * uvScale[0], j / yCount * uvScale[1]);
      }
    }
    for (let i = 0; i < xCount; i++) {
      for (let j = 0; j < yCount; j++) {
        const a = i * (yCount + 1) + j, b = a + 1, c = a + yCount + 1, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  // 完整封闭船壳：从左舷上缘绕过龙骨，再接到右舷上缘
  const hullGeo = gridGeometry(96, 30, (u, v) => {
    const x = -L + u * L * 2;
    const a = v * Math.PI;
    const w = hullHalfWidth(x);
    return new THREE.Vector3(
      x,
      sheerY(x) - hullDepth(x) * Math.sin(a),
      -w * Math.cos(a)
    );
  }, [8, 3]);
  const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({
    map: woodTex, color: 0xb4733d, roughness: .56, metalness: .015, side: THREE.DoubleSide
  }));
  hull.castShadow = hull.receiveShadow = true;
  boat.add(hull);

  // 实心甲板，带有中拱与船舷弧线
  const deckGeo = gridGeometry(82, 20, (u, v) => {
    const x = -L + u * L * 2;
    const t = v * 2 - 1;
    const w = Math.max(0, hullHalfWidth(x) * .975);
    return new THREE.Vector3(
      x,
      sheerY(x) - .024 + .024 * (1 - Math.abs(t)),
      t * w
    );
  }, [10, 4]);

  // 甲板顶面必须朝上；翻转默认网格的三角形方向，避免俯视看穿到水面。
  {
    const idx = deckGeo.getIndex().array;
    for (let i = 0; i < idx.length; i += 3) {
      const t = idx[i + 1];
      idx[i + 1] = idx[i + 2];
      idx[i + 2] = t;
    }
    deckGeo.setIndex(Array.from(idx));
    deckGeo.computeVertexNormals();
  }

  const deck = new THREE.Mesh(deckGeo, deckMat);
  deck.receiveShadow = true;
  boat.add(deck);

  // 船舷上缘与外板板缝线条
  function edgeCurve(side, height, sectionAngle = 0, radius = .016) {
    const pts = [];
    for (let i = 0; i <= 70; i++) {
      const x = -L + i / 70 * L * 2;
      const w = hullHalfWidth(x);
      const y = height === 'sheer' ? sheerY(x) + .008 : sheerY(x) - hullDepth(x) * Math.sin(sectionAngle);
      pts.push(new THREE.Vector3(x, y, side * w * Math.cos(sectionAngle)));
    }
    const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 100, radius, 6, false);
    const mesh = new THREE.Mesh(geo, trimMat);
    mesh.castShadow = true;
    return mesh;
  }
  for (const side of [1, -1]) {
    boat.add(edgeCurve(side, 'sheer', 0, .021));
    boat.add(edgeCurve(side, 'lap', Math.PI * .38, .011));
    boat.add(edgeCurve(side, 'lap', Math.PI * .62, .011));
  }

  // 中部木箱 / 舱口围板（保持甲板封闭，不做漏水开口）
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(.76, .10, .44), trimMat);
  trunk.position.set(-.18, .27, 0);

  boat.add(trunk);

  const trunkLid = new THREE.Mesh(new THREE.BoxGeometry(.70, .028, .38), deckMat);
  trunkLid.position.set(-.18, .335, 0);

  const bowHatch = new THREE.Mesh(new THREE.BoxGeometry(.34, .055, .30), trimMat);
  bowHatch.position.set(.56, .29, 0);

  // 龙骨、舵与舵柄

  const rudder = new THREE.Mesh(new THREE.BoxGeometry(.20, .30, .026), trimMat);

  // 斜桁应从桅杆处向船尾上方扬起，而不是垂向帆面。
  gaff.rotation.z = -Math.atan2(.38, .93);
  gaff.position.set(-.285, 1.62, 0);
  gaff.castShadow = true;
  boat.add(gaff);

  // 红白条纹主帆，带轻微受风弧度
  const sailGeo = new THREE.PlaneGeometry(.90, 1.02, 20, 14);
  {
    const pa = sailGeo.attributes.position;
    for (let i = 0; i < pa.count; i++) {
      const lx = pa.getX(i), ly = pa.getY(i);

      const t = THREE.MathUtils.clamp((ly + .51) / 1.02, 0, 1);

      pa.setY(i, -.51 + t * (topLocal + .51));

  const sail = new THREE.Mesh(sailGeo, new THREE.MeshStandardMaterial({
    map: boatSailTex, roughness: .68, side: THREE.DoubleSide
  }));
  sail.position.set(-.36, .93, .012);
  sail.rotation.y = .04;
  sail.castShadow = true;
  boat.add(sail);

  // 索具：前支索、后支索、两侧侧支索
  function rigging(from, to, radius = .006) {
    const a = new THREE.Vector3(...from), b = new THREE.Vector3(...to);
    const dir = b.clone().sub(a), len = dir.length();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 5), lineMat);
    mesh.position.copy(a).addScaledVector(dir, .5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return mesh;
  }
  boat.add(rigging([.18, 1.88, 0], [1.21, .24, 0], .005));
  boat.add(rigging([.18, 1.88, 0], [-1.19, .30, 0], .005));
  boat.add(rigging([.18, 1.58, 0], [.18, .28, .31], .0045));
  boat.add(rigging([.18, 1.58, 0], [.18, .28, -.31], .0045));
  boat.add(rigging([.18, 1.86, 0], [-.72, 1.81, 0], .004));

  boat.position.set(boatPos.x, 0, boatPos.y);
  boat.rotation.y = -PIER_A + 1.8;
  boat.scale.setScalar(0.9);
  scene.add(boat);
}

function updateVoyage(dt, t) {
  if (voyage.mode === 'toBoat') {
    const dx = pierBoard.x - sheepChar.position.x;
    const dz = pierBoard.y - sheepChar.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > .08) {
      const step = Math.min(dist, dt * 1.05);
      sheepChar.position.x += dx / dist * step;
      sheepChar.position.z += dz / dist * step;
      sheepChar.rotation.y = Math.atan2(dx, dz);
      sheepChar.position.y = terrainSurfaceAt(sheepChar.position.x, sheepChar.position.z) + .03 + Math.abs(Math.sin(t * 8)) * .018;
    } else {
      voyage.landPosition.copy(sheepChar.position);
      voyage.landRotationY = sheepChar.rotation.y;
      island.remove(sheepChar);
      boat.add(sheepChar);
      sheepChar.position.set(.44, .24, .03);
      sheepChar.rotation.set(0, Math.PI / 2, 0);
      voyage.mode = 'docked';
      voyage.hasSailed = false;
      voyage.heading = boatHomeHeading;
      controls.autoRotate = false;
      document.getElementById('btn-rotate').classList.remove('on');
      document.getElementById('btn-rotate').textContent = '自动旋转：关';
      setVoyageButton('🌊 点海面选目的地', true);
      setReturnButton('🚪 暂不下船', true);
      setVoyageStatus('已上船！点击海面标记目的地。');
    }
  } else if (voyage.mode === 'sail' || voyage.mode === 'return') {
    const desired = headingTo(boatPos, voyage.target);
    const d = Math.atan2(Math.sin(desired - voyage.heading), Math.cos(desired - voyage.heading));
    voyage.heading = turnToward(voyage.heading, desired, dt * 1.7);
    const dist = boatPos.distanceTo(voyage.target);
    const aim = dist > 2.4 ? 2.35 : 1.15;
    const alignment = 1 - Math.min(1, Math.abs(d) / Math.PI);
    voyage.speed += (aim * alignment - voyage.speed) * (1 - Math.exp(-dt * 2.6));
    boatPos.x += Math.cos(voyage.heading) * voyage.speed * dt;
    boatPos.y += -Math.sin(voyage.heading) * voyage.speed * dt;
    boatPos.x = Math.max(-HALF + 1.3, Math.min(HALF - 1.3, boatPos.x));
    boatPos.y = Math.max(-HALF + 1.3, Math.min(HALF - 1.3, boatPos.y));
    setVoyageFill(1 - Math.min(1, dist / Math.max(1, boatHome.distanceTo(voyage.target))));
    if (dist < .14) {
      boatPos.copy(voyage.target);
      voyage.speed = 0;
      if (voyage.mode === 'return') {
        voyage.mode = 'docked';
        setVoyageButton('🚪 下船', true);
        setReturnButton('🚪 下船', true);
        setVoyageStatus('回到码头了。可以下船，或另选海域。');
      } else {
        voyage.mode = 'fishReady';
        setVoyageButton('🎣 下竿钓鱼', true);
        setReturnButton('⚓ 返航下船', true);
        setVoyageStatus('已到钓点！准备下竿。');
      }
    }
  } else if (voyage.mode === 'docked') {
    voyage.heading += Math.atan2(Math.sin(boatHomeHeading - voyage.heading), Math.cos(boatHomeHeading - voyage.heading)) * (1 - Math.exp(-dt * 3));
  } else if (voyage.mode === 'fishing') {
    voyage.phaseTimer -= dt;
    setVoyageFill(.12 + Math.sin(t * 3) * .04);
    if (voyage.phaseTimer <= 0) {
      voyage.mode = 'bite';
      voyage.biteElapsed = 0;
      setVoyageButton('🎣 拉竿！', true);
      setVoyageStatus('咬钩了！立刻拉竿！');
      spawnRipple(boatPos.x + rr(-1.0, 1.0), boatPos.y + rr(-1.0, 1.0), .8);
    }
  } else if (voyage.mode === 'bite') {
    voyage.biteElapsed += dt;
    const left = Math.max(0, voyage.biteWindow - voyage.biteElapsed);
    setVoyageFill(left / voyage.biteWindow);
    if (left <= 0) endFishing(false);
  }

  // 船体随浪起伏；航行时增加俯仰与侧倾。
  const waveY = waveH(boatPos.x, boatPos.y, t) * .9 + .06;
  boat.position.set(boatPos.x, waveY, boatPos.y);
  boat.rotation.y = voyage.heading;
  const waveRoll = (waveH(boatPos.x + .7, boatPos.y, t) - waveH(boatPos.x - .7, boatPos.y, t)) * .22;
  const wavePitch = (waveH(boatPos.x, boatPos.y + .7, t) - waveH(boatPos.x, boatPos.y - .7, t)) * .22;
  boat.rotation.z = waveRoll + Math.sin(t * 1.1) * .02 + voyage.speed * .015;
  boat.rotation.x = wavePitch - voyage.speed * .018;

  if (voyage.mode === 'sail' || voyage.mode === 'return') {
    const sternX = boatPos.x - Math.cos(voyage.heading) * 1.15;
    const sternZ = boatPos.y + Math.sin(voyage.heading) * 1.15;
    if (Math.random() < dt * 18) spawnRipple(sternX + rr(-.12, .12), sternZ + rr(-.12, .12), .75);
  } else if (Math.random() < dt * .4) {
    spawnRipple(boatPos.x + rr(-.8, .8), boatPos.y + rr(-.5, .5), .6);
  }

  // 主角随船保持坐姿/站位，并轻微呼吸。
  if (sheepChar.parent === boat) {
    sheepChar.position.y = .24 + Math.sin(t * 2.4) * .008;
    sheepChar.rotation.z = Math.sin(t * 1.7) * .012;
  }

  // 目的地标记脉动。
  if (destinationMarker.visible) {
    destinationMarker.material.opacity = .62 + Math.sin(t * 5) * .22;
    const s = 1 + Math.sin(t * 3.2) * .08;
    destinationMarker.scale.set(s, s, 1);
  }

  // 航行/停泊时镜头轻轻跟随船体。
  if (sheepChar.parent === boat) {
    controls.target.lerp(new THREE.Vector3(boatPos.x, waveY - .35, boatPos.y), 1 - Math.exp(-dt * 2.4));
  }

}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (sleepState.active || Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (houseGroup) {
    const houseHits = raycaster.intersectObject(houseGroup, true);
    if (houseHits.length) { requestSleep(); return; }
  }
  const gullHits = raycaster.intersectObjects(gulls, true);
  if (gullHits.length) {
    let bird = gullHits[0].object;
    while (bird && !gulls.includes(bird)) bird = bird.parent;
    if (bird && startGullReturnNow(bird)) return;
  }
  const boatHits = raycaster.intersectObject(boat, true);
  if (boatHits.length) {
    requestBoardBoat();
    return;
  }
  const palmHits = raycaster.intersectObjects(palms, true);
  if (palmHits.length) {
    let obj = palmHits[0].object;
    while (obj && !palms.includes(obj)) obj = obj.parent;
    if (obj && window.__beginTreeTask) {
      window.__beginTreeTask(obj);
      return;
    }
  }
  const groundHits = raycaster.intersectObject(window.__islandGround, false);
  if (groundHits.length) {
    const local = island.worldToLocal(groundHits[0].point.clone());
    beginFreeWalk(local.x, local.z);
    // 命中岛面后不再触发水面投喂。
    return;
  }
  const hits = raycaster.intersectObject(water, false);
  if (hits.length) {
    const p = hits[0].point;
    const insideWater = Math.abs(p.x) < HALF - 1.25 && Math.abs(p.z) < HALF - 1.25;
    const clearOfIsland = Math.hypot(p.x - ISLAND_C.x, p.z - ISLAND_C.y) > 8.15;
    const aboardModes = ['docked', 'sail', 'return', 'fishReady', 'fishing', 'bite'];
    if (aboardModes.includes(voyage.mode) && insideWater && clearOfIsland) {
      // 点击即改航：航行/返航/钓鱼/等待咬钩都会立刻取消当前目标。
      startSailTo(p.x, p.z);
      return;
    }
    if (aboardModes.includes(voyage.mode)) {
      setVoyageStatus('这里不能停船，请选离岛稍远的海面。');
      return;
    }
    if (insideWater && clearOfIsland) feedAt(p.x, p.z, 6);
  }
});

const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  waterU.uTime.value = t;
  weedU.uTime.value = t;
  causticsTex.offset.x = (t * 0.016) % 1;
  causticsTex.offset.y = (t * 0.011) % 1;
  sandMat.emissiveIntensity = 0.65 + Math.sin(t * 1.8) * 0.15;
  stepEnv(dt);
  updateSleep(dt);
  lampLight.intensity = env.lampI * (1 + Math.sin(t * 7.3) * 0.06);
  beamMat.opacity = env.beamO;
  fireLight.intensity = env.fireI * (0.85 + 0.15 * Math.sin(t * 11) * Math.sin(t * 5.7));
  for (let fi = 0; fi < fireFlames.length; fi++) {
    fireFlames[fi].scale.y = 1 + 0.22 * Math.sin(t * 13 + fi * 2.1);
    fireFlames[fi].rotation.y = Math.sin(t * 3 + fi) * 0.2;
  }
  beamGroup.rotation.y = t * 0.55;

  island.position.y = Math.sin(t * 0.8) * 0.06;
  island.rotation.z = Math.sin(t * 0.7) * 0.008;
  island.rotation.x = Math.cos(t * 0.8) * 0.008;
  for (const f of foamRings) {
    const s = 1 + Math.sin(t * 1.2) * 0.006;
    f.scale.set(s, s, 1);
  }

  for (const b of bubbles) {
    b.position.y += b.userData.vy * dt;
    b.position.x += Math.sin(t * 2 + b.userData.ph) * 0.002;
    if (b.position.y > -0.15) b.position.y = -8.2;
  }

  for (const j of jellies) {
    const u = j.userData;
    j.visible = u.night
      ? (env.jelly > 0.82 ? u.moonVisible : (env.jelly > 0.38 ? u.sunsetVisible : false))
      : env.jelly < 0.45;
    if (!j.visible) continue;
    const q = 0.5 + 0.5 * Math.sin(t * 1.7 * u.sp + u.ph);
    const drift = 0.10 * u.sp;
    j.position.x = u.bx + Math.sin(t * 0.11 * u.sp + u.ph) * drift * 4;
    j.position.y = u.by + Math.sin(t * 0.42 * u.sp + u.ph) * 0.20;
    j.position.z = u.bz + Math.cos(t * 0.13 * u.sp + u.ph * 1.3) * drift * 4;
    j.rotation.set(
      u.baseRX + Math.sin(t * 0.21 * u.sp + u.ph) * 0.09,
      u.baseRY + Math.sin(t * 0.07 * u.sp + u.ph * 1.7) * 0.45,
      u.baseRZ + Math.cos(t * 0.17 * u.sp + u.ph) * 0.08
    );
    u.bell.scale.set(1 + q * 0.14, 1 - q * 0.17, 1 + q * 0.14);

    const nightHaloOn = envTarget === modeTargets.moon && u.night;
    const nightPulse = .82 + Math.sin(t * 1.9 * u.sp + u.ph) * .18;
    u.nightHalo.material.opacity = nightHaloOn ? nightPulse * .62 : 0;
  }

  const sleepControlsPose = sleepState.active && ['enter','fade','advance','wake'].includes(sleepState.phase);
  if (sheepChar && !sleepControlsPose && voyage.mode !== 'toBoat' && sheepChar.parent !== boat) {
    const st = sheepTask;
    const groundY = terrainSurfaceAt(sheepChar.position.x, sheepChar.position.z) + .03;
    if (st.phase === 'walk') {
      const dx = st.target.x - sheepChar.position.x, dz = st.target.z - sheepChar.position.z;
      const dist = Math.hypot(dx, dz), step = Math.min(dist, dt * 0.95);
      if (dist > 0.001) {
        sheepChar.position.x += dx / dist * step;
        sheepChar.position.z += dz / dist * step;
        sheepChar.rotation.y = Math.atan2(dx, dz);
        st.faceYaw = sheepChar.rotation.y;
      }
      sheepChar.position.y = groundY + Math.abs(Math.sin(t * 8.0)) * 0.018;
      if (dist < 0.10 && st.pathIndex < st.path.length - 1) {
        st.pathIndex++;
        setGroundTarget(st.target, st.path[st.pathIndex].x, st.path[st.pathIndex].y);
      } else if (dist < 0.06 && st.pathIndex >= st.path.length - 1) {
        if (st.kind === 'house') {
          st.phase = 'enter'; sleepState.phase = 'enter'; sleepState.timer = .58;
          sleepState.enterFrom.copy(sheepChar.position);
          sleepState.enterTo.set(houseDoorPoint.x, houseDoorPoint.y, houseDoorPoint.z);
          sheepChar.rotation.y = Math.atan2(houseDoorPoint.x - sheepChar.position.x, houseDoorPoint.z - sheepChar.position.z);
        } else if (st.kind === 'exit') {
          finishSleep();
        } else if (st.kind === 'tree' && st.tree && Math.hypot(sheepChar.position.x - st.tree.position.x, sheepChar.position.z - st.tree.position.z) < 1.05) {
          st.phase = 'shake'; st.timer = 1.7; st.spawned = 0; st.cocoTimer = 0.28;
          sheepChar.rotation.y = Math.atan2(st.tree.position.x - sheepChar.position.x, st.tree.position.z - sheepChar.position.z);
        } else {
          st.faceYaw = sheepChar.rotation.y;
          st.phase = 'idle'; st.kind = 'free'; st.tree = null; st.path = []; st.pathIndex = 0;
        }
      }
    } else if (st.phase === 'shake') {
      st.timer -= dt; st.cocoTimer -= dt;
      const top = st.tree.userData.top;
      top.rotation.z = Math.sin(t * 18.0) * 0.075 * Math.min(1, st.timer / 0.6);
      sheepChar.rotation.z = Math.sin(t * 18.0) * 0.025;
      if (st.cocoTimer <= 0 && st.spawned < 3 && window.__spawnCoconut) {
        window.__spawnCoconut(st.tree); st.spawned++; st.cocoTimer = rr(0.32, 0.48);
      }
      if (st.timer <= 0) {
        top.rotation.z = 0; sheepChar.rotation.z = 0;
        st.phase = 'return';
        st.path = planIslandPath({ x: sheepChar.position.x, z: sheepChar.position.z }, { x: st.home.x, z: st.home.y });
        st.pathIndex = 0;
        setGroundTarget(st.target, st.path[0].x, st.path[0].y);
      }
    } else if (st.phase === 'return') {
      const dx = st.target.x - sheepChar.position.x, dz = st.target.z - sheepChar.position.z;
      const dist = Math.hypot(dx, dz), step = Math.min(dist, dt * 0.85);
      if (dist > 0.001) {
        sheepChar.position.x += dx / dist * step;
        sheepChar.position.z += dz / dist * step;
        sheepChar.rotation.y = Math.atan2(dx, dz);
      }
      sheepChar.position.y = groundY + Math.abs(Math.sin(t * 7.2)) * 0.015;
      if (dist < 0.10 && st.pathIndex < st.path.length - 1) {
        st.pathIndex++;
        setGroundTarget(st.target, st.path[st.pathIndex].x, st.path[st.pathIndex].y);
      } else if (dist < 0.05 && st.pathIndex >= st.path.length - 1) {
        sheepChar.position.set(st.home.x, sheepChar.userData.by, st.home.y);
        sheepChar.rotation.set(0, sheepChar.userData.ry, 0);
        st.phase = 'idle'; st.tree = null; st.path = []; st.pathIndex = 0;
      }
    } else {
      // 待机高度跟随当前位置；朝向保留最后一次行走方向。
      const idleYaw = Number.isFinite(st.faceYaw) ? st.faceYaw : sheepChar.userData.ry;
      sheepChar.position.y = terrainSurfaceAt(sheepChar.position.x, sheepChar.position.z) + .03 + Math.sin(t * 2.2) * .012;
      sheepChar.rotation.y = idleYaw + Math.sin(t * 0.6) * .035;
    }
  }

  for (let ci = fallingCoconuts.length - 1; ci >= 0; ci--) {
    const c = fallingCoconuts[ci], u = c.userData;
    u.life -= dt;
    if (u.rest < 3) {
      u.vy -= 7.2 * dt;
      c.position.x += u.vx * dt; c.position.y += u.vy * dt; c.position.z += u.vz * dt;
      c.rotation.x += u.rx * dt; c.rotation.z += u.rz * dt;
      const cy = terrainSurfaceAt(c.position.x, c.position.z) + .09;
      if (c.position.y <= cy) {
        c.position.y = cy;
        if (Math.abs(u.vy) < 0.45) { u.vy = 0; u.vx *= 0.7; u.vz *= 0.7; u.rest = 3; }
        else { u.vy = Math.abs(u.vy) * 0.32; u.vx *= 0.55; u.vz *= 0.55; }
      }
    }
    if (u.life <= 0) { island.remove(c); fallingCoconuts.splice(ci, 1); }
  }
  for (const f of fishes) f.excite = Math.max(0, f.excite - dt * 0.6);

  for (const p of pellets) {
    if (p.dead) continue;
    p.life -= dt;
    if (!p.settled) {
      p.m.position.y -= 0.55 * dt;
      if (p.m.position.y <= -8.15) { p.m.position.y = -8.15; p.settled = true; }
    }
    if (p.life <= 0) { p.dead = true; scene.remove(p.m); }
  }

  for (const f of fishes) {
    if (!f.target || f.target.dead) {
      if (f.target) { f.release.copy(f.g.position); f.blend = 0; }
      f.target = pellets.find(p => !p.dead) || null;
    }
    const cruise = tmpV2.set(
      f.center.x + Math.cos(f.a) * f.r,
      f.y + Math.sin(t * 0.7 + f.a) * 0.15,
      f.center.y + Math.sin(f.a) * f.r
    );
    if (f.target && !f.target.dead) {
      const p = f.target;
      tmpV.copy(p.m.position).sub(f.g.position);
      const dist = tmpV.length();
      if (dist < 0.18 + f.L * 0.4) {
        p.dead = true; scene.remove(p.m);
        f.target = null; f.excite = 1.6;
        f.release.copy(f.g.position); f.blend = 0;
      } else {
        tmpV.normalize();
        f.g.position.addScaledVector(tmpV, Math.min(2.6 * (1 + f.excite) * dt, dist));
        tmpV.copy(f.g.position).add(tmpV);
        f.g.lookAt(tmpV);
      }
    } else {
      if (f.blend < 1) {
        f.blend = Math.min(1, f.blend + dt / 1.2);
        const e = f.blend * f.blend * (3 - 2 * f.blend);
        f.g.position.lerpVectors(f.release, cruise, e);
      } else {
        f.g.position.copy(cruise);
      }
      const na = f.a + 0.1 * Math.sign(f.sp);
      tmpV.set(
        f.center.x + Math.cos(na) * f.r,
        f.g.position.y,
        f.center.y + Math.sin(na) * f.r
      );
      f.g.lookAt(tmpV);
    }
    f.a += f.sp * dt * (1 + f.excite * 0.8);
    f.g.userData.tail.rotation.y = Math.sin(t * (9 + Math.abs(f.sp) * 8) * (1 + f.excite)) * (0.4 + f.excite * 0.25);
  }

  {
    const a = t * 0.14;
    const R = 8.3;
    whale.position.set(
      Math.cos(a) * R,
      -2.7 + Math.sin(t * 0.5) * 0.25,
      Math.sin(a) * R
    );
    whale.rotation.y = -a - Math.PI / 2;
    whale.rotation.z = Math.sin(t * 0.45) * 0.08;
    whaleTail.rotation.z = Math.sin(t * 2.2) * 0.32;
    whalePecL.rotation.x = Math.sin(t * 1.5) * 0.18;
    whalePecR.rotation.x = Math.sin(t * 1.5 + 1) * 0.18;
  }

  const nightBirds = envTarget === modeTargets.moon;
  gullRestTimer -= dt;
  if (nightBirds) {
    for (const b of gulls) startGullReturnNow(b);
    gullRestTimer = Math.max(gullRestTimer, 3);
  } else if (gullRestTimer <= 0) {
    gullRestTimer = sendGullToPerch() ? rr(16.0, 25.0) : 3.0;
  }

  for (const b of gulls) {
    const u = b.userData.u, r = b.userData.rest;
    u.away += ((nightBirds ? 1 : 0) - u.away) * (1 - Math.exp(-dt * .72));
    u.r = u.baseR + u.away * 22;
    u.h = u.baseH + u.away * 12;
    b.visible = !nightBirds || u.away < .97;
    if (u.mode === 'toPerch') {
      r.progress += dt / r.dur;
      const k = Math.min(r.progress, 1), e = k * k * (3 - 2 * k);
      perchPoint(r.perch, gullTmpA); r.target.copy(gullTmpA);
      gullTmpB.lerpVectors(r.start, r.target, e);
      gullTmpB.y += Math.sin(k * Math.PI) * 1.7;
      faceGullAlong(b, b.position, gullTmpB);
      b.position.copy(gullTmpB);
      b.rotation.z = 0.16 * (1 - k);
      b.userData.legs.visible = k > 0.48;
      const fold = 0.22 + k * 0.72;
      const flap = Math.sin(t * 6.5 + u.ph) * (0.46 - k * 0.32);
      b.userData.wings.forEach((w, wi) => {
        const s = wi === 0 ? 1 : -1;
        w.rotation.set(flap * s, -s * fold, 0);
      });
      if (r.progress >= 1) { u.mode = 'perch'; perchOrientation(b); }
    } else if (u.mode === 'perch') {
      perchPoint(r.perch, gullTmpA);
      b.position.copy(gullTmpA);
      perchOrientation(b);
      b.rotation.x = 0.025;
      b.rotation.z = Math.sin(t * 1.15 + u.ph) * 0.014;
      b.userData.legs.visible = true;
      const breathe = Math.sin(t * 1.6 + u.ph) * 0.018;
      b.userData.wings.forEach((w, wi) => {
        const s = wi === 0 ? 1 : -1;
        w.rotation.set(s * breathe, -s * 1.08, 0);
      });
      r.timer -= dt;
      if (r.timer <= 0) {
        r.start.copy(b.position); r.returnProgress = 0; u.mode = 'return';
      }
    } else if (u.mode === 'return') {
      r.returnProgress += dt / 3.0;
      u.a += u.sp * dt * 0.35;
      gullTmpB.set(Math.cos(u.a) * u.r, u.h + Math.sin(u.a * 2) * 0.4, Math.sin(u.a) * u.r);
      const k = Math.min(r.returnProgress, 1), e = k * k * (3 - 2 * k);
      gullTmpA.lerpVectors(r.start, gullTmpB, e);
      gullTmpA.y += Math.sin(k * Math.PI) * 0.8;
      faceGullAlong(b, b.position, gullTmpA);
      b.position.copy(gullTmpA);
      b.rotation.z = -0.08 * (1 - k);
      b.userData.legs.visible = r.returnProgress < 0.12;
      const flap = Math.sin(t * 8.5 + u.ph) * 0.58;
      b.userData.wings.forEach((w, wi) => {
        const s = wi === 0 ? 1 : -1;
        w.rotation.set(flap * s, -s * 0.08, 0);
      });
      if (r.returnProgress >= 1) { u.mode = 'fly'; b.userData.rest = null; }
    } else {
      u.a += u.sp * dt;
      b.position.set(Math.cos(u.a) * u.r, u.h + Math.sin(u.a * 2) * 0.4, Math.sin(u.a) * u.r);
      b.rotation.set(0, -u.a - Math.sign(u.sp) * Math.PI / 2, 0);
      b.userData.legs.visible = false;
      const flap = Math.sin(t * 9 + u.ph) * 0.65;
      b.userData.wings.forEach((w, wi) => {
        const s = wi === 0 ? 1 : -1;
        w.rotation.set(flap * s, 0, 0);
      });
    }
  }

  updateVoyage(dt, t);

  for (const r of ripplePool) {
    if (!r.m.visible) continue;
    r.t += dt;
    if (r.t < 0) { r.m.material.opacity = 0; continue; }
    const k = r.t / 1.1;
    if (k >= 1) { r.m.visible = false; continue; }
    const sc = (0.25 + k * 2.6) * (r.m.userData.scale || 1);
    r.m.scale.setScalar(sc);
    r.m.material.opacity = (1 - k) * 0.7;
  }

  for (const c of clouds) {
    c.position.x += c.userData.v * dt;
    if (c.position.x > 42) c.position.x = -42;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const loadingEl = document.getElementById('loading');
loadingEl.style.opacity = '0';
setTimeout(() => loadingEl.remove(), 600);

window.addEventListener('error', () => {
  const l = document.getElementById('loading');
  if (l) { l.style.opacity = '1'; l.textContent = '资源加载失败，请检查网络后刷新（Three.js 来自 CDN）'; }
});
</script>
</body>
</html>
