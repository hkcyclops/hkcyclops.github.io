<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hkcyclops · 入口</title>
<meta name="description" content="个人入口页：悬浮海岛 · 灯塔微缩水景，以及咚咚羊学习小屋。">
<meta name="theme-color" content="#04161F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --ocean-ink:#04161F;
  --ocean:#0E4F68;
  --ocean-hi:#17607D;
  --foam:#DCEEF5;
  --sun:#E8A33D;
  --paper:#F6F1E7;
  --paper-deep:#E7DCC9;
  --ink:#241F1A;
  --ink-soft:#5C5147;
  --seal:#B3402F;
  --f-display:"Instrument Serif","Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-mono:"IBM Plex Mono","Courier New",monospace;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--f-body);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

.split{position:relative;min-height:100vh;min-height:100svh;overflow:hidden}

.pane{
  position:absolute;inset:0;
  display:block;text-decoration:none;color:inherit;
}
.pane--island{
  background:
    radial-gradient(78% 58% at 24% 74%, var(--ocean-hi) 0%, var(--ocean) 42%, #093245 68%, var(--ocean-ink) 100%);
  clip-path:polygon(0 0, 57% 0, 46% 100%, 0 100%);
}
.pane--study{
  background:linear-gradient(158deg, #FCF9F2 0%, var(--paper) 46%, var(--paper-deep) 100%);
  clip-path:polygon(57% 0, 100% 0, 100% 100%, 46% 100%);
}

.pane__inner{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  height:100%;
}
.pane--island .pane__inner{
  justify-content:center;align-items:flex-start;
  padding:0 20% 0 7vw;
}
.pane--study .pane__inner{
  justify-content:flex-end;align-items:flex-end;text-align:right;
  padding:0 6.5vw 13vh 20%;
}

.eyebrow{
  margin:0 0 20px;
  font-family:var(--f-mono);font-size:12px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
}
.pane--island .eyebrow{color:var(--sun)}
.pane--study .eyebrow{color:var(--seal)}

.title{
  margin:0;
  font-family:var(--f-display);
  font-size:clamp(38px,5.4vw,74px);
  font-weight:400;line-height:1.04;letter-spacing:.01em;
}
.pane--island .title{color:#F2FAFD}
.pane--study .title{color:var(--ink);font-size:clamp(32px,4.3vw,58px)}

.sub{
  margin:14px 0 0;
  font-family:var(--f-mono);font-size:13px;letter-spacing:.16em;
}
.pane--island .sub{color:rgba(220,238,245,.66)}
.pane--study .sub{color:var(--ink-soft)}

.rule{
  width:52px;height:1px;margin:26px 0;
  border:0;
}
.pane--island .rule{background:linear-gradient(90deg,var(--sun),rgba(232,163,61,0))}
.pane--study .rule{background:linear-gradient(270deg,var(--seal),rgba(179,64,47,0));margin-left:auto}

.desc{
  margin:0;
  max-width:30ch;
  font-size:15px;line-height:1.85;
}
.pane--island .desc{color:rgba(220,238,245,.8)}
.pane--study .desc{color:var(--ink-soft)}

.cta{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:34px;
  font-family:var(--f-mono);font-size:13px;font-weight:500;
  letter-spacing:.14em;
  padding-bottom:6px;
  border-bottom:1px solid currentColor;
  transition:gap .28s cubic-bezier(.2,.7,.3,1),opacity .28s ease;
}
.pane--island .cta{color:var(--sun)}
.pane--study .cta{color:var(--seal)}
.cta svg{width:16px;height:16px;flex:none}
.pane:hover .cta{gap:18px}
.pane:focus-visible{outline:2px solid var(--sun);outline-offset:-6px}
.pane--study:focus-visible{outline-color:var(--seal)}

.brand{
  position:fixed;top:26px;left:7vw;z-index:4;
  margin:0;
  font-family:var(--f-mono);font-size:12px;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;
  color:rgba(220,238,245,.5);
  pointer-events:none;
}

.sea{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.wave{
  position:absolute;left:-10%;right:-10%;height:1px;
  background:linear-gradient(90deg,rgba(220,238,245,0) 0%,rgba(220,238,245,.5) 50%,rgba(220,238,245,0) 100%);
}
.wave--1{bottom:22%}
.wave--2{bottom:15%;opacity:.6}
.wave--3{bottom:9%;opacity:.34}
.grain{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg,rgba(36,31,26,.055) 0 1px,transparent 1px 29px);
}

@media (prefers-reduced-motion: no-preference){
  .pane__inner > *{opacity:0;transform:translateY(16px);animation:rise .85s cubic-bezier(.2,.7,.3,1) forwards}
  .pane__inner > :nth-child(1){animation-delay:.10s}
  .pane__inner > :nth-child(2){animation-delay:.22s}
  .pane__inner > :nth-child(3){animation-delay:.34s}
  .pane__inner > :nth-child(4){animation-delay:.42s}
  .pane__inner > :nth-child(5){animation-delay:.54s}
  .pane--study .pane__inner > :nth-child(1){animation-delay:.20s}
  .pane--study .pane__inner > :nth-child(2){animation-delay:.32s}
  .pane--study .pane__inner > :nth-child(3){animation-delay:.44s}
  .pane--study .pane__inner > :nth-child(4){animation-delay:.52s}
  .pane--study .pane__inner > :nth-child(5){animation-delay:.64s}
  @keyframes rise{to{opacity:1;transform:none}}
  .wave--1{animation:drift 13s ease-in-out infinite}
  .wave--2{animation:drift 17s ease-in-out infinite reverse}
  .wave--3{animation:drift 21s ease-in-out infinite}
  @keyframes drift{
    0%,100%{transform:translate3d(-2.2%,0,0)}
    50%{transform:translate3d(2.2%,0,0)}
  }
}

@media (max-width:860px){
  .split{display:flex;flex-direction:column;min-height:0}
  .pane{position:static;clip-path:none;min-height:0}
  .pane--study{flex:1 1 auto}
  .pane__inner{height:auto}
  .pane--island .pane__inner{padding:88px 8vw 72px;justify-content:flex-start}
  .pane--study .pane__inner{padding:72px 8vw 88px;align-items:flex-start;text-align:left}
  .pane--study .rule{margin-left:0;background:linear-gradient(90deg,var(--seal),rgba(179,64,47,0))}
  .pane--study .desc{max-width:32ch}
  .pane--study .title{font-size:clamp(30px,8vw,44px)}
  .brand{left:8vw;top:22px;color:rgba(220,238,245,.55)}
  .grain{background-image:repeating-linear-gradient(0deg,rgba(36,31,26,.05) 0 1px,transparent 1px 26px)}
  .pane--study .desc{color:#5C5147}
}
</style>
</head>
<body>

<h1 class="sr-only">hkcyclops 入口：悬浮海岛与咚咚羊学习小屋</h1>
<p class="brand">hkcyclops</p>

<main class="split">

  <a class="pane pane--island" href="https://hkcyclops.github.io/island/">
    <span class="sea" aria-hidden="true">
      <span class="wave wave--1"></span>

      <span class="wave wave--3"></span>

    <span class="pane__inner">

      </span>

  <a class="pane pane--study" href="https://hkcyclops-d6gv9yceeb7d04811-1481081725.tcloudbaseapp.com/">
    <span class="grain" aria-hidden="true"></span>
    <span class="pane__inner">
      <span class="eyebrow">02 — 学习</span>
      <span class="title">咚咚羊学习小屋</span>

      <hr class="rule">

      <span class="cta">进入小屋
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
      </span>
    </span>
  </a>

</main>

</body>
</html>
