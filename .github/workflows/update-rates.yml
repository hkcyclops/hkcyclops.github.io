name: Update AIA Exchange Rates

# 每日自動抓取 AIA 官方匯率，寫入 data/rates.js 並推回倉庫。
# 這是匯率資料的主力來源；Cloudflare Worker 只是即時刷新的補充。
# 兩套並存：任一邊失效，網站都還有資料可用。

on:
  schedule:
    # UTC 00:00 = 香港時間 08:00
    # 注意：GitHub 不定時延遲，實際可能在 08:05–08:30 之間，偶爾跳過一次。
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 Actions 分頁手動觸發

permissions:
  contents: write # 少了這段推不上去

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rates from AIA
        run: |
          mkdir -p data
          curl -sS --fail --max-time 30 \
            "https://www1.aia.com.hk/CorpWS/Investment/Get/ExchangeRate2" \
            -o /tmp/aia.json

          # 抓到空檔就中止，保留昨天的資料，不要寫壞檔案
          if [ ! -s /tmp/aia.json ]; then
            echo "::error::抓取結果為空，保留既有資料"
            exit 1
          fi

          # 轉成 .js 而非 .json：這樣 file:// 本機直接開啟也能載入
          # （fetch() 讀 JSON 在 file 協定下會被 CORS 擋住）
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/aia.json", "utf8"));
            if (!Array.isArray(raw) || raw.length < 2) { console.error("資料格式異常"); process.exit(1); }
            const asOf = (raw.find(r => r.type === "date") || {}).value || "";
            const rates = {};
            for (const r of raw) if (r.type !== "date") rates[r.type.toUpperCase()] = r.value;
            const payload = { asOf, fetchedAt: new Date().toISOString(), rates };
            fs.writeFileSync("data/rates.js",
              "window.AIA_RATES = " + JSON.stringify(payload, null, 2) + ";\n");
            console.log("日期:", asOf, "幣種數:", Object.keys(rates).length);
          '

      - name: Commit only if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          git add data/rates.js

          # 匯率沒變就不要提交，避免每天空 commit 刷滿歷史
          if git diff --quiet --cached; then
            echo "匯率未變動，略過提交"
          else
            git commit -m "chore(rates): update $(date -u +%Y-%m-%d)"
            git push
          fi
